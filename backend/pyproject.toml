[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = [
    "live_api: calls the real Gemini API (deselected by default; run with -m live_api)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "RUF012"]  # RUF012: Django Meta attrs

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"apps/workbook/**" = ["E501", "S", "B", "BLE", "SIM", "PERF", "RUF", "C4", "UP", "PLR", "PLW", "ARG", "TRY", "RET"]  # hackathon speed (user OK)
"apps/ai/web_tools.py" = ["E501"]
"apps/ai/digest.py" = ["E501", "BLE", "PLR", "C4", "RUF001", "SIM", "S110"]
"apps/ai/cfo_qa_tools.py" = ["E501", "RUF001", "PLR", "C4", "BLE", "RUF059"]
"apps/ai/growth_tools.py" = ["E501", "E731", "RUF001", "RUF059", "PLR", "C4"]
"apps/ai/cfo_router.py" = ["E501"]
"apps/engine/growth.py" = ["E501", "RUF001", "PLR", "C4", "BLE"]
"apps/ai/prompts.py" = ["E501"]  # prompt prose
"apps/ai/management/commands/voice_spike.py" = ["E501"]  # spike question data
"apps/insights/advice.py" = ["E501"]  # Uzbek text templates
"apps/insights/alerts.py" = ["E501"]  # Uzbek alert templates
"apps/engine/advisor.py" = ["E501"]
"apps/ai/advisor_tools.py" = ["E501"]  # Uzbek templates
"apps/ai/cfo_tools.py" = ["E501"]
"apps/ai/detail_tools.py" = ["E501"]
"apps/insights/charts.py" = ["E501"]
"apps/insights/trends.py" = ["E501"]
"apps/ingestion/finmodel_details.py" = ["E501"]
"apps/engine/cfo.py" = ["E501"]
"apps/ai/router.py" = ["E501"]
"apps/ai/tools.py" = ["E501"]  # Uzbek tool texts
"apps/ai/chat.py" = ["E501"]  # Uzbek system prompt
"apps/ai/guard.py" = ["E501"]
"apps/ai/views.py" = ["E501"]
"apps/knowledge/learning.py" = ["E501"]
"apps/knowledge/api.py" = ["E501"]
"apps/tenancy/api.py" = ["E501"]  # Uzbek error messages
"apps/finance/demo_clone.py" = ["E501"]
"apps/insights/api.py" = ["E501"]  # Uzbek UI strings
"apps/finance/demo.py" = ["S311", "E501"]  # deterministic demo data, not crypto
"apps/finance/demo_export.py" = ["S311", "E501"]
"apps/finance/management/commands/seed_demo.py" = ["E501"]
"apps/ai/live_api.py" = ["E501"]  # Uzbek context text
"apps/ai/management/commands/*.py" = ["E501"]  # report lines
"apps/telemetry/management/commands/*.py" = ["E501"]  # report lines
"apps/ingestion/*.py" = ["E501"]  # Uzbek issue messages
"apps/integrations/api.py" = ["E501"]  # Uzbek error messages

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["apps.workbook.*", "apps.ai.web_tools", "apps.ai.growth_tools", "apps.engine.growth", "apps.ai.cfo_qa_tools", "apps.ai.digest"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false

[tool.django-stubs]
django_settings_module = "config.settings"
