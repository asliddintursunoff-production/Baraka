# Local stack.
#   make db   -> only Postgres (for `make dev`: Django + Vite run on the host with hot reload)
#   make up   -> the whole app in Docker: db + web (Django API + built React) + scheduler
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bizpilot
      POSTGRES_PASSWORD: bizpilot
      POSTGRES_DB: bizpilot
    ports:
      - "5433:5432" # 5432 on the host is often taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizpilot -d bizpilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    image: bizpilot-app
    env_file: .env
    environment:
      DATABASE_URL: postgres://bizpilot:bizpilot@db:5432/bizpilot
    command: ["/app/docker/start-web.sh"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health?deep=1', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  scheduler:
    image: bizpilot-app
    env_file: .env
    environment:
      DATABASE_URL: postgres://bizpilot:bizpilot@db:5432/bizpilot
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
